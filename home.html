<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="home.css">
</head>
<body>
   <header>
    <div class="nav-bar">
        <div class="nav" id="logo">
            <img src="logo.jpg" />
        </div>


        <div class="nav" id="home">
           <i class="fa-solid fa-house"></i> Home
        </div>
        <div class="nav" id="new">
            <i class="bi bi-cloud-plus"></i>
            New
        </div>

        <div class="nav" id="lan">
            <div class="lan-first">Lan: </div>
            <div class="lan-last">
                <select id="lang" name="language">
                <option value="eng">Eng</option>
                <option value="nep">Nep</option>
 
              </select></div>
        </div>

      
        <div class="nav" id="about">
            <i class="bi bi-file-person-fill"></i>
            About us

        </div>
        
        <div class="nav" id="search-bar">
            <div class="search">
                <input id ="searchInput" type="text" placeholder="🔍Search">  
            </div>
            <div class="search-icon" onclick="googleSearch()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

        </div>


        <div class="nav" id="log-out">
            
            <i class="bi bi-box-arrow-left"></i>
            Logout

        </div>
        
    </div>
   </header>

   <script src="home.js"></script>
</body>
</html>
