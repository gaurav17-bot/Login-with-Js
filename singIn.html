<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="signIn.css">
</head>
<body>
    
    <div class="container">
        <p id="login">Sign Up</p>
        <form id="loginForm">
        <div class="inp-box">
            <input class="box" id="username" type="text" placeholder="Enter username">
            <input class="box" id="email" type="text" placeholder="Enter email">
            <input class="box" id="password" type="password" placeholder="Enter password">
            <input class="box" id="password2" type="password" placeholder="Confirm-password">
        </div>

        <div id="msg"></div>
        
        

        <div class="button-box">
            <button id="log-in" type="submit" >Submit</button>
        </div>

       
    </form>

    </div>
    
    
    <script src="signup.js"></script>
</body>
</html>
