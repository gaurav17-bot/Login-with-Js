<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="new.css">
</head>
<body>
    <div class="container">
        <p id="login">Login</p>
        <form id="loginForm">
        <div class="inp-box">
            <input class="box" id="username" type="text" placeholder="username">
            <input class="box" id="password" type="password" placeholder="password">
            <p id="errorMsg"> </p>
        </div>
        
        
        <div class="remember">
            <input id="check" type="checkbox">
            <p>Remember me?</p>
            <p id="clickMe">Forget password?</p>
        </div>

        <div class="button-box">
            <button id="log-in" type="submit" >Enter</button>
        </div>

        <div class="last">
            <p>Don't have an account?</p>
            <p id="sign-in">Sign-up</p>
        </div>
    </form>

    </div>
    
    <script src="new.js"></script>
</body>
</html>
